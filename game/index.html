<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Keeper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d1c; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 160vh); aspect-ratio: 16 / 10; display: block; cursor: crosshair; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="960" height="600" aria-label="Lantern Keeper: move with WASD, aim with the mouse, hold the button to shoot light and keep the beacon alive until dawn"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
